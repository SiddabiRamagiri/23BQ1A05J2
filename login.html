<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4ef">
    <title>Gather — Find your people</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #747970;
            --paper: #f5f4ef;
            --white: #fffefa;
            --green: #c8ef69;
            --coral: #ef735b;
            --line: #e7e6df;
            font-family: "DM Sans", sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--paper);
        }

        button, input { font: inherit; }

        .page-shell {
            display: grid;
            grid-template-columns: minmax(420px, 1fr) minmax(430px, 0.92fr);
            min-height: 100vh;
            padding: 18px;
            gap: 18px;
        }

        .story-panel {
            position: relative;
            display: flex;
            min-height: calc(100vh - 36px);
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 32px 38px 30px;
            border-radius: 9px;
            isolation: isolate;
            background: #c7dbb3;
        }

        .story-photo {
            position: absolute;
            z-index: -2;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 38%;
        }

        .story-panel::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            content: "";
            background: linear-gradient(180deg, rgb(20 31 23 / 28%) 0%, transparent 34%, rgb(20 31 23 / 70%) 100%);
        }

        .topbar, .bottom-copy, .wordmark, .nav-action, .social-proof, .proof-avatars, .field-heading, .password-wrap, .form-options, .submit-button, .switch-copy {
            display: flex;
            align-items: center;
        }

        .topbar, .field-heading, .form-options { justify-content: space-between; }

        .wordmark {
            gap: 10px;
            color: white;
            font-family: Manrope, sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .brand-mark {
            position: relative;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--green);
        }

        .brand-mark::before, .brand-mark::after {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid #263321;
            border-radius: 50%;
            content: "";
        }

        .brand-mark::before { top: 5px; left: 4px; }
        .brand-mark::after { right: 4px; bottom: 4px; }

        .nav-action {
            min-height: 40px;
            padding: 0 15px;
            border: 1px solid rgb(255 255 255 / 54%);
            border-radius: 5px;
            color: white;
            background: rgb(30 39 30 / 14%);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 160ms ease;
        }

        .nav-action:hover { background: rgb(30 39 30 / 30%); }

        .bottom-copy { align-items: flex-end; justify-content: space-between; gap: 22px; }

        .story-title {
            max-width: 460px;
            margin: 0;
            color: white;
            font-family: Manrope, sans-serif;
            font-size: clamp(42px, 5.1vw, 70px);
            font-weight: 700;
            line-height: 0.99;
            letter-spacing: 0;
        }

        .story-title span { color: var(--green); }

        .social-proof {
            flex-shrink: 0;
            gap: 11px;
            margin-bottom: 5px;
            color: white;
        }

        .proof-avatars { padding-left: 5px; }

        .proof-avatars img {
            width: 30px;
            height: 30px;
            margin-left: -5px;
            border: 2px solid white;
            border-radius: 50%;
            object-fit: cover;
        }

        .proof-label { font-size: 12px; line-height: 1.4; }
        .proof-label strong { display: block; font-size: 14px; }

        .form-panel {
            display: grid;
            min-height: calc(100vh - 36px);
            place-items: center;
            padding: 48px 36px;
        }

        .auth-content { width: min(100%, 410px); animation: arrive 420ms ease both; }

        .mobile-wordmark { display: none; }

        .eyebrow {
            margin: 0 0 12px;
            color: #69745a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Manrope, sans-serif;
            font-size: 38px;
            font-weight: 700;
            line-height: 1.16;
            letter-spacing: 0;
        }

        .intro { margin: 11px 0 30px; color: var(--muted); font-size: 15px; line-height: 1.55; }

        .auth-form { display: grid; gap: 17px; }

        .field { display: grid; gap: 8px; }

        .field label, .field-heading label { font-size: 13px; font-weight: 600; }

        .field input {
            width: 100%;
            height: 49px;
            padding: 0 14px;
            border: 1px solid #dcded6;
            border-radius: 5px;
            outline: none;
            color: var(--ink);
            background: var(--white);
            font-size: 14px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .field input::placeholder { color: #9a9d95; }
        .field input:focus { border-color: #6b8249; box-shadow: 0 0 0 3px rgb(107 130 73 / 14%); }

        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 54px; }

        .show-password {
            position: absolute;
            right: 9px;
            min-width: 40px;
            height: 36px;
            border: 0;
            border-radius: 4px;
            color: #69745a;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .show-password:hover { background: #f0f0e9; }

        .text-button, .switch-button {
            padding: 0;
            border: 0;
            color: #52693a;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .text-button:hover, .switch-button:hover { text-decoration: underline; }
        .form-options { min-height: 20px; font-size: 13px; }

        .remember-option { display: inline-flex; align-items: center; gap: 8px; color: #62675f; cursor: pointer; }
        .remember-option input, .terms-option input { width: 15px; height: 15px; margin: 0; accent-color: #52693a; }

        .terms-option { display: flex; align-items: flex-start; gap: 9px; color: #62675f; font-size: 12px; line-height: 1.5; }
        .terms-option input { flex: 0 0 auto; margin-top: 2px; }

        .submit-button {
            justify-content: center;
            width: 100%;
            min-height: 51px;
            margin-top: 2px;
            border: 0;
            border-radius: 5px;
            color: #20271b;
            background: var(--green);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform 150ms ease, background 150ms ease;
        }

        .submit-button:hover { transform: translateY(-1px); background: #bde65a; }
        .submit-button:active { transform: translateY(0); }

        .switch-copy { justify-content: center; gap: 5px; margin: 25px 0 0; color: var(--muted); font-size: 13px; }
        .feedback { min-height: 19px; margin: 12px 0 0; color: #52693a; font-size: 13px; text-align: center; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .page-shell { grid-template-columns: minmax(300px, 0.9fr) minmax(380px, 1.1fr); padding: 12px; gap: 12px; }
            .story-panel, .form-panel { min-height: calc(100vh - 24px); }
            .story-panel { padding: 26px 24px; }
            .bottom-copy { align-items: flex-start; flex-direction: column; }
            .story-title { font-size: clamp(42px, 6vw, 58px); }
            .form-panel { padding: 38px 24px; }
        }

        @media (max-width: 720px) {
            .page-shell { display: block; min-height: 100vh; padding: 0; }
            .story-panel { display: none; }
            .form-panel { min-height: 100vh; padding: 36px 24px; }
            .auth-content { max-width: 420px; }
            .mobile-wordmark { display: flex; margin-bottom: 42px; color: var(--ink); }
            .mobile-wordmark .brand-mark { flex: 0 0 auto; }
            h1 { font-size: 34px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="story-panel" aria-label="Discover the Gather community">
            <img class="story-photo" src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Friends enjoying a sunny afternoon together">
            <div class="topbar">
                <a class="wordmark" href="#" aria-label="Gather home"><span class="brand-mark" aria-hidden="true"></span>gather</a>
                <button class="nav-action" type="button" data-mode="signup">Join the community</button>
            </div>
            <div class="bottom-copy">
                <h2 class="story-title">Good things<br>happen when<br>we <span>gather.</span></h2>
                <div class="social-proof" aria-label="A community of over 20,000 people">
                    <div class="proof-avatars" aria-hidden="true">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="">
                        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="">
                    </div>
                    <div class="proof-label"><strong>20k+ people</strong>finding their circle</div>
                </div>
            </div>
        </section>

        <section class="form-panel" aria-labelledby="form-title">
            <div class="auth-content" id="auth-content">
                <a class="wordmark mobile-wordmark" href="#" aria-label="Gather home"><span class="brand-mark" aria-hidden="true"></span>gather</a>
                <p class="eyebrow" id="form-eyebrow">Your people are here</p>
                <h1 id="form-title">Welcome back</h1>
                <p class="intro" id="form-intro">Pick up right where your community left off.</p>

                <form class="auth-form" id="auth-form">
                    <div class="field" id="name-field" hidden>
                        <label for="full-name">Your name</label>
                        <input id="full-name" name="name" type="text" autocomplete="name" placeholder="Alex Morgan">
                    </div>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <div class="field-heading"><label for="password">Password</label><button class="text-button" id="forgot-button" type="button">Forgot password?</button></div>
                        <div class="password-wrap">
                            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required>
                            <button class="show-password" id="show-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                        </div>
                    </div>
                    <div class="form-options" id="remember-row">
                        <label class="remember-option"><input type="checkbox" name="remember"> Keep me signed in</label>
                    </div>
                    <label class="terms-option" id="terms-row" hidden>
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the <a class="text-button" href="#terms">Terms of Service</a> and <a class="text-button" href="#privacy">Privacy Policy</a>.</span>
                    </label>
                    <button class="submit-button" id="submit-button" type="submit">Log in</button>
                </form>
                <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
                <p class="switch-copy"><span id="switch-prompt">New to Gather?</span><button class="switch-button" id="switch-button" type="button">Create an account</button></p>
            </div>
        </section>
    </main>

    <script>
        const form = document.querySelector("#auth-form");
        const nameField = document.querySelector("#name-field");
        const nameInput = document.querySelector("#full-name");
        const termsRow = document.querySelector("#terms-row");
        const termsInput = document.querySelector("#terms");
        const rememberRow = document.querySelector("#remember-row");
        const passwordInput = document.querySelector("#password");
        const feedback = document.querySelector("#feedback");
        let isSignup = false;

        function setMode(signup) {
            isSignup = signup;
            nameField.hidden = !signup;
            nameInput.required = signup;
            termsRow.hidden = !signup;
            termsInput.required = signup;
            rememberRow.hidden = signup;
            document.querySelector("#form-eyebrow").textContent = signup ? "A little more you, please" : "Your people are here";
            document.querySelector("#form-title").textContent = signup ? "Find your people" : "Welcome back";
            document.querySelector("#form-intro").textContent = signup ? "Create your account and join the conversation." : "Pick up right where your community left off.";
            document.querySelector("#submit-button").textContent = signup ? "Create account" : "Log in";
            document.querySelector("#switch-prompt").textContent = signup ? "Already have an account?" : "New to Gather?";
            document.querySelector("#switch-button").textContent = signup ? "Log in" : "Create an account";
            document.querySelector("#forgot-button").hidden = signup;
            passwordInput.autocomplete = signup ? "new-password" : "current-password";
            feedback.textContent = "";
        }

        document.querySelectorAll("[data-mode='signup']").forEach(button => button.addEventListener("click", () => setMode(true)));
        document.querySelector("#switch-button").addEventListener("click", () => setMode(!isSignup));

        document.querySelector("#show-password").addEventListener("click", event => {
            const show = passwordInput.type === "password";
            passwordInput.type = show ? "text" : "password";
            event.currentTarget.textContent = show ? "Hide" : "Show";
            event.currentTarget.setAttribute("aria-label", `${show ? "Hide" : "Show"} password`);
            event.currentTarget.setAttribute("aria-pressed", String(show));
        });

        document.querySelector("#forgot-button").addEventListener("click", () => {
            const email = document.querySelector("#email");
            if (!email.value) {
                feedback.textContent = "Enter your email address and we'll help you reset your password.";
                email.focus();
                return;
            }
            feedback.textContent = "If an account exists for that email, password reset instructions are on the way.";
        });

        form.addEventListener("submit", event => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            feedback.textContent = isSignup ? "Your account details are ready to go." : "You're all set to log in.";
        });
    </script>
</body>
</html>
